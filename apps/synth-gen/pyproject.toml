[tool.poetry]
name = "synth-gen"
version = "0.1.0"
description = "Synthetic data generation service for RegLoom, handling AI-compliant data weaving with GAN-based synthesis and anomaly detection."
authors = ["RegLoom Team <info@regloom.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src", from = "."}]

[tool.poetry.dependencies]
python = "^3.12,<3.13"
numpy = "^1.26.4"
pandas = "^2.2.2"
scikit-learn = "^1.5.0"
ctgan = "^0.10.1"
presidio-analyzer = "^2.2.356"
presidio-anonymizer = "^2.2.356"
fairlearn = "^0.10.0"
structlog = "^24.4.0"
torch = { version = "2.2.2", source = "pytorch-cpu" }
torchvision = { version = "0.17.2", source = "pytorch-cpu" }
torchaudio = { version = "2.2.2", source = "pytorch-cpu" }
uvicorn = "^0.38.0"
fastapi = "^0.123.9"
pydantic = "^2.12.5"
poetry = "^2.2.1"
opentelemetry-api = "^1.39.0"
opentelemetry-sdk = "^1.39.0"
opentelemetry-instrumentation-fastapi = "^0.60b0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
black = "^24.8.0"
mypy = "^1.11.2"
ruff = "^0.6.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.mypy]
strict = true
ignore_missing_imports = true

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "N", "D", "UP", "YTT", "S", "BLE", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "TD", "FIX", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = ["D203", "D213"]