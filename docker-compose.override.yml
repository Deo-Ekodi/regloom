  backend:
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules
      - ./logs:/logs
      - pnpm-store:/app/.pnpm-store
      - ./uploads:/app/apps/uploads
    environment:
      - SERVICE_NAME=backend
      - LOG_LEVEL=debug
      - LOG_DIR=/logs
      - NODE_ENV=development
    command: pnpm --filter @regloom/backend dev
  privacy-engine:
    volumes:
      - ./apps/privacy-engine:/app/apps/privacy-engine
      - /app/apps/privacy-engine/node_modules
      - ./logs:/logs
      - pnpm-store:/app/.pnpm-store
    environment:
      - SERVICE_NAME=privacy-engine
      - LOG_LEVEL=debug
      - LOG_DIR=/logs
      - NODE_ENV=development
    command: pnpm --filter @regloom/privacy-engine dev
  rule-engine:
    volumes:
      - ./apps/rule-engine:/app/apps/rule-engine
      - /app/apps/rule-engine/node_modules
      - ./logs:/logs
      - pnpm-store:/app/.pnpm-store
    environment:
      - SERVICE_NAME=rule-engine
      - LOG_LEVEL=debug
      - LOG_DIR=/logs
      - NODE_ENV=development
    command: pnpm --filter @regloom/rule-engine dev
