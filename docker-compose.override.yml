# docker-compose.override.yml
services:
  frontend:
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - /app/apps/frontend/node_modules
      - ./logs:/logs
    environment:
      - SERVICE_NAME=frontend
      - LOG_LEVEL=debug
      - LOG_DIR=/logs
      - NODE_ENV=development
    command: pnpm --filter @regloom/frontend dev
  backend:
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules
      - ./logs:/logs
    environment:
      - SERVICE_NAME=backend
      - LOG_LEVEL=debug
      - LOG_DIR=/logs
      - NODE_ENV=development
  privacy-engine:
    volumes:
      - ./apps/privacy-engine:/app/apps/privacy-engine
      - /app/apps/privacy-engine/node_modules
      - ./logs:/logs
    environment:
      - SERVICE_NAME=privacy-engine
      - LOG_LEVEL=debug
      - LOG_DIR=/logs
      - NODE_ENV=development
  rule-engine:
    volumes:
      - ./apps/rule-engine:/app/apps/rule-engine
      - /app/apps/rule-engine/node_modules
      - ./logs:/logs
    environment:
      - SERVICE_NAME=rule-engine
      - LOG_LEVEL=debug
      - LOG_DIR=/logs
      - NODE_ENV=development
  synth-gen:
    volumes:
      - ./apps/synth-gen:/app/apps/synth-gen
      - ./logs:/logs
    environment:
      - SERVICE_NAME=synth-gen
      - LOG_LEVEL=debug
      - LOG_DIR=/logs
      - NODE_ENV=development