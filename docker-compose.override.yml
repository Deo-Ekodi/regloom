# docker-compose.override.yml
services:
  # frontend: (uncomment when ready)
  # frontend:
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #     - ./logs:/logs
  #   environment:
  #     - SERVICE_NAME=frontend
  #     - LOG_LEVEL=debug
  #     - LOG_DIR=/logs
  #     - NODE_ENV=development
  #   command: pnpm --filter @regloom/frontend dev

  backend:
    volumes:
      - .:/app                  # ← mount monorepo root
      - /app/node_modules       # ← prevent host node_modules bleed
      - ./logs:/logs
      - ./uploads:/app/uploads
      - pnpm-store:/app/.pnpm-store
    environment:
      - SERVICE_NAME=backend
      - LOG_LEVEL=debug
      - LOG_DIR=/logs
      - NODE_ENV=development
    command: pnpm --filter @regloom/backend run dev

  privacy-engine:
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/logs
      - pnpm-store:/app/.pnpm-store
    environment:
      - SERVICE_NAME=privacy-engine
      - LOG_LEVEL=debug
      - LOG_DIR=/logs
      - NODE_ENV=development
    command: pnpm --filter @regloom/privacy-engine run dev

  rule-engine:
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/logs
      - pnpm-store:/app/.pnpm-store
    environment:
      - SERVICE_NAME=rule-engine
      - LOG_LEVEL=debug
      - LOG_DIR=/logs
      - NODE_ENV=development
    command: pnpm --filter @regloom/rule-engine run dev

  synth-gen:
      volumes:
        - .:/app
        - ./logs:/logs
      environment:
        - SERVICE_NAME=synth-gen
        - LOG_LEVEL=debug
        - LOG_DIR=/logs
        - NODE_ENV=development
        - PYTHONPATH=/app/apps/synth-gen
      command: uvicorn apps.synth-gen.main:app --host 0.0.0.0 --port 4003 --reload --log-level debug